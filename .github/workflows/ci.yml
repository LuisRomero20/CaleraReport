name: CaleraReport Enterprise CI

on:
  push:
    branches: [ main, enterprise-evolution ]
  pull_request:
    branches: [ main, enterprise-evolution ]

jobs:
  test:
    name: Test Suite & Security Validation (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Generate synthetic fixtures
        run: |
          python scripts/generar_fixtures_sinteticos.py

      - name: Run test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Security audit check (fail-closed check on --auto)
        run: |
          python -c "import subprocess, sys; p = subprocess.run([sys.executable, 'scripts/1_sap_miro_scripting.py', '--auto'], capture_output=True, text=True); assert p.returncode != 0, 'FAIL-CLOSED VIOLATION: --auto must exit non-zero without authorization'; print('Fail-closed audit check PASSED')"
